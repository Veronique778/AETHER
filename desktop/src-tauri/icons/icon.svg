<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AETHER app icon: the sidebar brand mark (orbit glyph on the radial teal tile), enlarged. -->
  <defs>
    <radialGradient id="tile" cx="30%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1d6f8a"/>
      <stop offset="1" stop-color="#0b1c2c"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#tile)"/>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="none" stroke="#0b6a80" stroke-width="16"/>
  <g transform="translate(512 512) scale(30) translate(-12 -12)" fill="none" stroke="#00e5ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z M20.5 12c0 2.5-3.8 4.5-8.5 4.5S3.5 14.5 3.5 12 7.3 7.5 12 7.5s8.5 2 8.5 4.5Z M18.5 5.5l1 1"/>
