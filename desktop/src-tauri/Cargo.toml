[package]
name = "aether-desktop"
version = "1.0.0"
description = "AETHER – Adaptive Ecosystem for Human Exploration and Resilience (desktop shell)"
authors = ["AETHER team"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
