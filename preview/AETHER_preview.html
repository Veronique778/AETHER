@keyframes aether-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

  to {
    transform: translateX(100%);
  }
}

  0%, 100% {
    opacity: .55;
  }
  50% {
    opacity: 1;
  }
}

  from {
    transform: scale(.6);
    opacity: .9;
  }
  to {
    transform: scale(1.6);
    opacity: 0;
  }
}
@keyframes aether-flow {
  to {
    stroke-dashoffset: -24;
  }
}

  0%, 100% {
    transform: scale(.72);
    opacity: .75;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}

    transform: translate3d(-50%, 0, 0);
  }
